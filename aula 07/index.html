<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <form method="post" action=""onsubmit="alert('Bem vindo ao sistema!')">
         <h2> Bem-Vindo ao Sistema!</h2>
         <p>Insira seus dados para logar </p>
         
         <label>Insira seu nome</label><br>
         <input type="text" name="login"placeholder="Insira seu nome"><br>

         <label>Insira sua senha:</label><br>
         <input type="password" name="pwd" placeholder="Insira sua senha"><br>

         <label>Insira seu email:</label><br>
         <input type="email" name="email"placeholder="Insira seu email" required><br><br>
        
         <p>Qual e seu meio de Transporte?</p>
         <input type="checkbox"name="veiculos"value="bicicleta">
          Eu tenho uma bicicleta<br>
         <input type="checkbox"name="veiculos"value="carro">
         Eu tenho um carro<br>
         <input type="checkbox"name="vaiculos"value="moto">
         Eu tenho uma moto<br>

         <p>Qual e o seu sexo?</p>
         <input type="radio"
                  id="Feminino"
                  name="sexo"
                  value="feminino"
                  required>
         <label for="feminino">Feminino</label>
         <br>
         <input type="radio"
                  id="masculino"
                  name="sexo"
                  value="masculino"
                  required>
         <label for="masculino">Masculino</label>
         <br>
        <input type="radio"
                  id="nao-informar"
                  name="sexo"
                  value="nao_informar"
                  required>
         <label for="nao informar">Prefiro não informar</label>
         <br><br>
         <p>Data de nascimento</p>
         <input type="date"name="nascimento"><br><br>

         <input type="submit">
    </form>
    
</body>
</html>
