<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Listar Alunos</title>

    <style>
        body {
            background-color: rgb(117, 117, 117);
            color: rgba(255, 255, 255, 0.767);
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        /* CABEÇALHO */

        .cabecalho {
            width: 100%;
            background-color: rgb(55, 55, 55);
            padding: 25px 0;
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecalho h1 {
            margin: 0;
            color: rgba(0, 195, 255, 0.712);
            font-size: 42px;
        }

        .cabecalho h2 {
            margin: 10px 0 0;
            color: rgba(0, 195, 255, 0.712);
            font-size: 30px;
        }

        /* CONTAINER */

        .container {
            width: 90%;
            max-width: 850px;
            background-color: rgb(37, 37, 37);
            padding: 40px;
            border-radius: 15px;
            box-sizing: border-box;
        }

        /* TÍTULOS */

        h2 {
            color: rgba(0, 174, 255, 0.712);
            font-size: 30px;
            text-align: center;
            margin-bottom: 25px;
        }

        /* TEXTOS */

        p {
            color: white;
            font-size: 20px;
            line-height: 1.7;
            text-align: center;
        }

        /* FAIXA */

        .faixa {
            width: 100%;
            height: 6px;
            background: repeating-linear-gradient(
                to right,
                #00a2ff 0px,
                #e7e6af 70px,
                transparent 70px,
                transparent 105px
            );
            margin-bottom: 25px;
        }

        /* MENU */

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .nav-container {
            padding: 15px 25px;
            border-radius: 10px;
            background-color: rgb(55, 55, 55);
            transition: background-color 0.3s, transform 0.3s;
        }

        .nav-container a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .nav-container:hover {
            background-color: rgb(0, 110, 255);
            transform: translateY(-3px);
        }

        /* TABELA DE ALUNOS */

        .tabela-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            color: white;
        }

        th {
            background-color: rgb(55, 55, 55);
            color: rgba(0, 195, 255, 0.9);
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgb(85, 85, 85);
        }

        tr:hover {
            background-color: rgb(55, 55, 55);
        }

        /* RODAPÉ */

        footer {
            margin-top: 40px;
            padding: 20px;
            color: white;
            text-align: center;
            font-size: 16px;
        }

        /* CELULAR */

        @media (max-width: 600px) {
            .cabecalho h1 {
                font-size: 32px;
            }

            .cabecalho h2 {
                font-size: 22px;
            }

            .container {
                padding: 20px;
                width: 100%;
            }

            nav {
                gap: 10px;
            }

            .nav-container {
                padding: 12px 18px;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>

</head>

<body>

    <!-- CABEÇALHO -->

    <header class="cabecalho">
        <h1>Listar Alunos</h1>
        <h2>Consulte os alunos cadastrados!</h2>
    </header>

    <!-- CONTEÚDO -->

    <main class="container">

        <div class="faixa"></div>

        <h2>Alunos cadastrados</h2>

        <p>Aqui você poderá consultar os alunos cadastrados no sistema.</p>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Gmail</th>
                        <th>Idade</th>
                        <th>Turma</th>
                    </tr>
                </thead>

                <tbody>
                    <!-- Os alunos serão exibidos aqui quando a listagem for conectada ao banco de dados. -->
                </tbody>
            </table>
        </div>

        <!-- MENU -->

        <nav>
            <div class="nav-container">
                <a href="/">Início</a>
            </div>

            <div class="nav-container">
                <a href="/cadastro">Cadastrar Aluno</a>
            </div>
        </nav>

    </main>

    <!-- RODAPÉ -->

    <footer>
        Lucas Meireles - 10/09/2026
    </footer>

</body>

</html>
