<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Alunos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: rgb(117, 117, 117);
            color: rgba(255, 255, 255, 0.767);
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CABEÇALHO */

        .cabecalho {
            width: 100%;
            background-color: rgb(55, 55, 55);
            padding: 25px 15px;
            text-align: center;
            margin-bottom: 35px;
        }

        .cabecalho h1 {
            margin: 0;
            color: rgba(0, 195, 255, 0.712);
            font-size: 42px;
        }

        .cabecalho h2 {
            margin: 10px 0 0;
            color: rgba(0, 195, 255, 0.712);
            font-size: 24px;
            font-weight: normal;
        }

        /* FORMULÁRIO */

        .container {
            width: 90%;
            max-width: 600px;
            background-color: rgb(37, 37, 37);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .container h2 {
            color: rgba(0, 195, 255, 0.9);
            font-size: 28px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: white;
            font-size: 17px;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #666;
            border-radius: 8px;
            background-color: rgb(55, 55, 55);
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #00c3ff;
            box-shadow: 0 0 5px rgba(0, 195, 255, 0.5);
        }

        input[type="submit"] {
            margin-top: 28px;
            background-color: rgb(0, 110, 255);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        input[type="submit"]:hover {
            background-color: rgb(0, 195, 255);
            transform: translateY(-2px);
        }

        /* BOTÃO DE VOLTAR */

        .voltar {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background-color: rgb(55, 55, 55);
            color: #00c3ff;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        .voltar:hover {
            background-color: rgb(0, 110, 255);
            color: white;
        }

        /* RODAPÉ */

        footer {
            margin-top: auto;
            padding-top: 35px;
            color: white;
            text-align: center;
            font-size: 15px;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .cabecalho h1 {
                font-size: 30px;
            }

            .cabecalho h2 {
                font-size: 19px;
            }

            .container {
                width: 100%;
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <header class="cabecalho">
        <h1>Cadastro de Alunos</h1>
        <h2>Para um futuro onde seus estudos te levarem!</h2>
    </header>

    <main class="container">

        <h2>Preencha seus dados</h2>

        <form action="/adicionar" method="POST">

            <label for="nome">Nome do aluno:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite o nome completo"
                required
            >

            <label for="gmail">E-mail:</label>
            <input
                type="email"
                id="gmail"
                name="gmail"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="idade">Idade:</label>
            <input
                type="number"
                id="idade"
                name="idade"
                min="1"
                max="120"
                placeholder="Digite sua idade"
                required
            >

            <label for="turma">Turma:</label>
            <input
                type="text"
                id="turma"
                name="turma"
                placeholder="Ex.: Desenvolvimento de Sistemas"
                required
            >

            <input type="submit" value="Cadastrar Aluno">

        </form>

        <a class="voltar" href="/">← Voltar à página inicial</a>

    </main>

    <footer>
        Lucas Meireles - 10/09/2026
    </footer>

</body>
</html>
