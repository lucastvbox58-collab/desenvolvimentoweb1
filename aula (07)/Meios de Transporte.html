<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meios de Transporte</title>
</head>
<body>
    <form method="post" action=""onsubmit="alert('Resposta enviada com Sucesso!')">
       <h2> Pesquisa sobre Meios de Transporte </h2>
       <BR><P>Preencha os dados abaixo</P>

        <label>Insira seu nome</label><br>
        <input type="text" name="login"placeholder="Insira seu nome"required><BR>

        <p>Insira sua data de nascimento</p>
        <input type="Date"name="nascimento"><br>

        <p>Qual e seu meio de Transporte?</p>
         <input type="checkbox"name="veiculos"value="bicicleta">
          Eu tenho uma bicicleta<br>
         <input type="checkbox"name="veiculos"value="carro">
         Eu tenho um carro<br>
         <input type="checkbox"name="veiculos"value="moto">
         Eu tenho uma moto<br>
         <input type="checkbox"name="veiculos"value="Onibus">
         Eu uso Onibus<br>
         <input type="checkbox"name="veiculos"value="Aplicativo de transporte">
         Eu uso app de transporte<br>
         <input type="checkbox"name="veiculos"value="Caminhada">
         Eu Faço Caminhada<BR>
        <br>
         <label for="veiculos">Quantos veículos você possuí?</label><BR>
        
         <input type="namber" id="veiculos" name="veiculos" min="0" placeholder="Digite a quantidade"><br>
        <br>
         <label>Insira um Comentário sobre o trânsito da cidade: </label><br>
        <input type="textarea" name="comentario" placeholder="Comentário obrigatório " required> <br> <br>

               <input type="button" value="Clique aqui" onclick="alert('Obrigado por participar da pesquisa!')">
        <br><br>   
        <input type ="submit">
        </form>
</body>
</html>
